name = "medsim-api"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# KHÔNG khai báo routes → dùng subdomain .workers.dev mặc định
#   URL: https://medsim-api.khanhtruongnguyen.workers.dev
# Sau này nếu có custom domain (vd: api.tenmien.com) → uncomment routes bên dưới:
# routes = [
#   { pattern = "api/*", zone_name = "tenmien.com" }
# ]

# Env vars cần đặt trong dashboard (Workers & Pages → Settings → Variables):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY,
#   AI_API_KEY, AI_API_BASE_URL,
#   AI_MAIN_MODEL, AI_JUDGE_MODEL
# (Secrets nên khai báo secret ở đây rồi `wrangler secret put <tên>`)
# [vars]
# SUPABASE_URL = ""
